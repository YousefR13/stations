<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>متابعة المحطات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* SE brand palette (SE BRAND.pdf §07); Readex Pro stands in for the private SE Heartbeat font. */
:root{
  --bg:#F2F3F5; --card:#ffffff; --ink:#00183A; --muted:#5B6575; --line:#E6E8EB; --soft:#F2F3F5;
  --brand:#0027B9; --brand-ink:#ffffff; --near:#DDF6EC;
  --amber:#8A5400; --amber-bg:#FFF3DC; --danger:#A8003F; --danger-bg:#FDE6EE;
  --db:#001F5E; --tg:#00B476; --to:#EF9B00; --tr:#E10054;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:var(--db);color:#fff;overflow:hidden;
  padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
header svg.wave{position:absolute;left:0;right:0;bottom:-8px;width:100%;height:70px;opacity:.5;pointer-events:none}
header .bar,header .updated{position:relative;z-index:1}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:600;flex:1;min-width:140px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:#C9D6F2}
.seg button.on{background:#fff;color:var(--db);font-weight:600}
.icon-btn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer}
.updated{font-size:12px;color:#AFC0E0;max-width:1100px;margin:6px auto 0}
main{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .label{font-size:13px;color:var(--muted)}
.kpi .value{font-size:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.red .value{color:var(--danger)} .kpi.amber .value{color:var(--amber)} .kpi.green .value{color:#00744C}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;min-width:0}
.grid2 section.card{margin-top:0}
section h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
section h2 .count{font-size:12px;font-weight:500;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.num{font-weight:700;direction:ltr;text-align:right}
.meter{display:flex;align-items:center;gap:8px;min-width:110px}
.meter span{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--tg)}
.meter b{font-size:12px;font-weight:600;color:var(--muted);min-width:34px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.open{background:var(--soft);color:var(--muted)}
.pill.claimed{background:var(--amber-bg);color:var(--amber)}
.pill.done{background:var(--near);color:#00744C}
.pill.red{background:var(--danger-bg);color:var(--danger)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input,.filters select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:14px}
.filters input{flex:1;min-width:140px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.feed li:last-child{border-bottom:0}
.feed time{color:var(--muted);font-size:12px;min-width:76px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.more{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;cursor:pointer;font-size:13px}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.lock[hidden]{display:none}
.lock .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:340px}
.lock h3{margin:0 0 6px;font-size:18px} .lock p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.lock input{width:100%;font-size:18px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);letter-spacing:4px;text-align:center}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--brand-ink);width:100%;margin-top:10px;font-size:15px}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}
.pill.conf{background:var(--soft);color:var(--ink)}
.act{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.act.go{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:380px}
.modal h3{margin:0 0 4px;font-size:17px} .modal p{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.6}
.modal label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.modal input,.modal textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:16px}
.modal textarea{min-height:60px;resize:vertical}
.modal .row{display:flex;gap:8px;margin-top:14px}
.modal .row .btn{margin-top:0}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}

/* ---------- boss view: the summary first, everything else folded away ---------- */
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#C9D6F2;position:relative;z-index:1}
.live i{width:8px;height:8px;border-radius:50%;background:#00FF86;animation:beat 2s infinite}
.live.stale i{background:#EF9B00;animation:none}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(0,255,134,.55)}70%{box-shadow:0 0 0 8px rgba(0,255,134,0)}100%{box-shadow:0 0 0 0 rgba(0,255,134,0)}}
@media (prefers-reduced-motion:reduce){.live i,.feed li.new{animation:none}}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .pct{font-size:44px;font-weight:700;line-height:1;color:var(--db);font-variant-numeric:tabular-nums}
.hero .of{font-size:15px;color:var(--muted)}
.hero .of b{color:var(--ink);font-weight:600}
.sbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft)}
.sbar i{display:block;height:100%;transition:width .6s ease}
.sbar .d{background:var(--tg)} .sbar .c{background:var(--to)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--soft);border-radius:12px;padding:9px 10px}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.g b{color:#00744C} .stat.o b{color:var(--amber)} .stat.r b{color:var(--danger)}
.rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.prow .fig{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .fig b{color:var(--ink)}
.prow .sbar{grid-column:1 / -1;height:8px}
.pill.ok{background:var(--near);color:#00744C}
.field ul{list-style:none;margin:0;padding:0}
.field li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.field li:last-child{border-bottom:0}
.field .when{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.feed li.new{animation:flash 2.4s ease-out}
@keyframes flash{from{background:#FFF3DC}to{background:transparent}}
details.more-wrap{margin-top:16px}
details.more-wrap>summary{cursor:pointer;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.more-wrap>summary::-webkit-details-marker{display:none}
details.more-wrap>summary::after{content:"▾";color:var(--muted)}
details.more-wrap[open]>summary::after{content:"▴"}
details.more-wrap .seg{background:var(--card);border:1px solid var(--line);margin-top:12px;width:max-content;max-width:100%}
details.more-wrap .seg button{color:var(--muted)}
details.more-wrap .seg button.on{background:var(--db);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two section.card{margin-top:12px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="lock" id="lock"><div class="box">
  <h3>متابعة المحطات</h3><p>أدخل الرمز السري للدخول.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" autofocus>
  <button class="btn" id="enter">دخول</button>
  <div class="err" id="err"></div>
</div></div>



<header>
  <div class="bar">
    <h1>متابعة المحطات</h1>
    <span class="live" id="live"><i></i><span id="liveTxt">مباشر</span></span>
    <button class="icon-btn" id="refresh">↻ تحديث</button>
    <button class="icon-btn" id="logout">خروج</button>
  </div>
  <svg class="wave" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#0027B9" stop-opacity="0"/><stop offset=".45" stop-color="#0080FF"/><stop offset="1" stop-color="#00FF86"/></linearGradient></defs>
    <g fill="none" stroke="url(#wg)" stroke-width=".7">
      <path d="M0 62 C70 62 90 70 140 52 S220 6 270 20 S340 70 400 40"/><path d="M0 64 C70 64 92 72 142 55 S222 10 272 24 S342 72 400 44"/>
      <path d="M0 66 C70 66 94 74 144 58 S224 14 274 28 S344 74 400 48"/><path d="M0 68 C70 68 96 76 146 61 S226 18 276 32 S346 76 400 52"/>
      <path d="M0 70 C70 70 98 78 148 64 S228 22 278 36 S348 78 400 56"/></g></svg>
</header>

<main>
  <div class="hero" id="hero"></div>

  <div class="two">
    <section class="card" id="tasksCard" hidden><h2>المهام</h2><div class="rows" id="tasks"></div></section>
    <section class="card"><h2>المناطق <span class="count">التقدم حسب المنطقة</span></h2><div class="rows" id="areas"></div></section>
  </div>

  <div class="two">
    <section class="card field"><h2>في الميدان الآن <span class="count" id="fieldCount"></span></h2><ul id="field"></ul></section>
    <section class="card"><h2>آخر النشاط</h2><ul class="feed" id="feed"></ul></section>
  </div>

  <details class="more-wrap" id="moreWrap"><summary>التفاصيل الكاملة: المشرفون والمشغلون وكل المحطات</summary>
  <div class="seg" id="period">
    <button data-p="today" class="on">اليوم</button><button data-p="7">٧ أيام</button><button data-p="30">٣٠ يوم</button><button data-p="all">الكل</button>
  </div>
  <div class="kpis" id="kpis" style="margin-top:12px"></div>

  <div class="grid2" style="margin-top:12px">
    <section class="card">
      <h2>حسب المشرف <span class="count">المحطات المطلوبة في الفترة</span></h2>
      <div class="scroll"><table id="bySup"></table></div>
    </section>
    <section class="card">
      <h2>حسب المشغل <span class="count">الإنجاز في الفترة</span></h2>
      <div class="scroll"><table id="byTech"></table></div>
    </section>
  </div>

  <section class="card">
    <h2>المحطات <span class="count" id="stCount"></span></h2>
    <div class="filters">
      <input id="q" type="search" inputmode="numeric" placeholder="بحث برقم المحطة">
      <select id="fStatus">
        <option value="">كل الحالات</option><option value="pending">المتبقية</option><option value="open">لم يتوجه لها أحد</option>
        <option value="claimed">في الطريق</option><option value="done">تمت</option><option value="urgent">العاجلة</option>
      </select>
      <select id="fSup"><option value="">كل المشرفين</option></select>
    </div>
    <div class="scroll"><table id="stations"></table></div>
    <button class="more" id="more" hidden>عرض المزيد</button>
  </section>

  </details>
</main>

<script>
// Apps Script web-app URL — same as index.html. ?api=... overrides it for testing.
const API_URL = 'https://script.google.com/macros/s/AKfycbzQT9uehMSSz_cjepDeP1iE2XxiBFvxcEjkEiz_4IJCr1I_KxdZU20dxqXeDoXSP3oX/exec';
const API = new URLSearchParams(location.search).get('api') || API_URL;

const $ = id => document.getElementById(id);
const ss = {
  get(k){ try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v){ try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} }
};
let pin = ss.get('dash_pin'), data = { items: [], log: [] }, period = 'today', shown = 50;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const t = v => v ? new Date(v) : null;
const fmtTime = d => d ? d.toLocaleString('ar-SA', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—';
const fmtDur = ms => {
  if (ms == null || !isFinite(ms) || ms < 0) return '—';
  const m = Math.round(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d ? `${d} يوم ${h % 24} س` : h ? `${h} س ${m % 60} د` : `${m} د`;
};
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const STATUS = { open: 'لم يتوجه لها أحد', claimed: 'في الطريق', done: 'تمت' };
const ACTION = { confirm: 'أكّد إنجاز', add: 'أضاف', remove: 'حذف', urgent: 'جعل عاجلة', normal: 'ألغى العجلة', claim: 'في الطريق إلى', unclaim: 'ألغى الحجز', done: 'أنهى', undo: 'تراجع عن',
  group: 'أنشأ مهمة', group_delete: 'حذف مهمة', register: 'سجّل في التطبيق', op_reset: 'أعاد تعيين كود' };
// districts: a station belongs to the nearest centre within 2.5 km (add districts here as real stations arrive)
const AREAS = [['العاقول', 24.5170, 39.7149], ['شوران', 24.3953, 39.6236], ['العزيزية', 24.4196, 39.5007], ['سلطانة', 24.4780, 39.5780], ['السيح', 24.4698, 39.5956]];
const km = (a, b, c, d) => { const r = Math.PI / 180, h = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };
const areaOf = i => { let best = null, bd = 2.5; for (const [n, la, lo] of AREAS) { const d = km(+i.lat, +i.lng, la, lo); if (d < bd) { bd = d; best = n; } } return best || 'مناطق أخرى'; };
const ago = d => { if (!d) return ''; const m = Math.round((Date.now() - d) / 60000); return m < 1 ? 'الآن' : m < 60 ? `قبل ${m} د` : m < 1440 ? `قبل ${Math.floor(m / 60)} س` : fmtTime(d); };
const stationsAr = n => n === 1 ? 'محطة واحدة' : n === 2 ? 'محطتان' : n >= 3 && n <= 10 ? n + ' محطات' : n + ' محطة';
const bar = (done, on, total) => `<div class="sbar"><i class="d" style="width:${total ? done / total * 100 : 0}%"></i><i class="c" style="width:${total ? on / total * 100 : 0}%"></i></div>`;
let lastLoad = 0, seenLog = null;

function since(){
  if (period === 'all') return 0;
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (period !== 'today') d.setDate(d.getDate() - (+period - 1));
  return d.getTime();
}

async function load(){
  const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'dashboard', pin }) });
  const d = await res.json();
  if (d.error) throw new Error(d.error);
  data = d; lastLoad = Date.now(); tick();
  fillSupervisors(); renderBoss(); render();
}

function fillSupervisors(){
  const cur = $('fSup').value;
  const sups = [...new Set(data.items.map(i => i.added_by || 'غير محدد'))].sort();
  $('fSup').innerHTML = '<option value="">كل المشرفين</option>' + sups.map(s => `<option>${esc(s)}</option>`).join('');
  $('fSup').value = sups.includes(cur) ? cur : '';
}

// the part the boss reads: overall, tasks, districts, who is out now, latest activity
function renderBoss(){
  const items = data.items, total = items.length;
  const done = items.filter(i => i.status === 'done'), on = items.filter(i => i.status === 'claimed');
  const left = total - done.length - on.length, urgent = items.filter(i => i.priority === 'high' && i.status !== 'done').length;
  const day0 = new Date(); day0.setHours(0, 0, 0, 0);
  const today = done.filter(i => +t(i.done_at) >= +day0).length;
  $('hero').innerHTML = `<div class="top"><span class="pct">${total ? Math.round(done.length / total * 100) : 0}%</span>
      <span class="of"><b>${done.length}</b> من <b>${total}</b> محطة تمت</span></div>
    ${bar(done.length, on.length, total)}
    <div class="stats"><div class="stat g"><b>${today}</b><span>تمت اليوم</span></div><div class="stat o"><b>${on.length}</b><span>في الطريق الآن</span></div>
      <div class="stat"><b>${left}</b><span>لم يتوجه لها أحد</span></div><div class="stat ${urgent ? 'r' : ''}"><b>${urgent}</b><span>عاجلة متبقية</span></div></div>`;

  // tasks (special-task links), newest first
  const byId = new Map(items.map(i => [String(i.id), i]));
  const groups = (data.groups || []).map(g => { const its = g.ids.map(x => byId.get(String(x))).filter(Boolean);
    return { ...g, n: its.length, d: its.filter(i => i.status === 'done').length, c: its.filter(i => i.status === 'claimed').length }; }).filter(g => g.n).reverse();
  $('tasksCard').hidden = !groups.length;
  $('tasks').innerHTML = groups.map(g => `<div class="prow"><span class="nm">${esc(g.name || 'مهمة خاصة')}</span>
    <span class="fig"><b>${g.d}</b> من ${g.n}${g.c ? ` · ${g.c} في الطريق` : ''}</span>${bar(g.d, g.c, g.n)}</div>`).join('');

  // districts, the ones that need help first
  const ar = {};
  for (const i of items) { const k = areaOf(i), a = ar[k] = ar[k] || { n: 0, d: 0, c: 0 }; a.n++; if (i.status === 'done') a.d++; if (i.status === 'claimed') a.c++; }
  const rows = Object.entries(ar).map(([k, a]) => ({ k, ...a, p: a.d / a.n, left: a.n - a.d - a.c }))
    .sort((x, y) => (x.k === 'مناطق أخرى') - (y.k === 'مناطق أخرى') || x.p - y.p);
  const tag = a => a.p < 0.3 && a.left >= 5 ? '<span class="pill red">تحتاج دعم</span>' : a.p < 0.6 ? '<span class="pill claimed">متابعة</span>' : '<span class="pill ok">على المسار</span>';
  $('areas').innerHTML = rows.length ? rows.map(a => `<div class="prow"><span class="nm">${esc(a.k)} ${tag(a)}</span>
    <span class="fig"><b>${a.d}</b> من ${a.n} · ${Math.round(a.p * 100)}%</span>${bar(a.d, a.c, a.n)}</div>`).join('') : '<div class="empty">لا توجد محطات بعد</div>';

  // operators on their way right now
  const field = on.slice().sort((a, b) => t(b.claimed_at) - t(a.claimed_at));
  $('fieldCount').textContent = field.length ? stationsAr(field.length) : '';
  $('field').innerHTML = field.length ? field.slice(0, 8).map(i => `<li><span><b>${esc(i.claimed_by)}</b> ← <span dir="ltr">S${esc(i.station)}</span> · ${esc(areaOf(i))}</span><span class="when">${ago(t(i.claimed_at))}</span></li>`).join('')
    + (field.length > 8 ? `<li class="empty">و${stationsAr(field.length - 8)} أخرى</li>` : '') : '<li class="empty">لا يوجد مشغل في الطريق الآن</li>';

  // latest activity; lines that arrived since the last refresh flash once
  const log = (data.log || []).slice(0, 10), key = l => l.time + l.action + l.station + l.who;
  const fresh = seenLog ? new Set(log.filter(l => !seenLog.has(key(l))).map(key)) : new Set();
  seenLog = new Set((data.log || []).map(key));
  $('feed').innerHTML = log.length ? log.map(l => {
    const st = l.station !== '' && !isNaN(Number(l.station)) ? ` <b dir="ltr">S${esc(l.station)}</b>` : l.station ? ` ${esc(l.station)}` : '';
    return `<li class="${fresh.has(key(l)) ? 'new' : ''}"><time>${ago(t(l.time))}</time><span><b>${esc(String(l.who).replace(/^المشرف: /, ''))}</b> ${ACTION[l.action] || esc(l.action)}${st}${l.note && l.action !== 'add' ? ` <span class="muted">· ${esc(l.note)}</span>` : ''}</span></li>`;
  }).join('') : '<li class="empty">لا يوجد نشاط بعد</li>';
}

// the "live" label: time since the last successful refresh
function tick(){
  if (!lastLoad) return;
  const sec = Math.round((Date.now() - lastLoad) / 1000);
  $('live').classList.toggle('stale', sec > 90);
  $('liveTxt').textContent = sec < 10 ? 'مباشر · محدّث الآن' : sec < 60 ? `مباشر · قبل ${sec} ث` : `آخر تحديث قبل ${Math.floor(sec / 60)} د`;
}
setInterval(tick, 5000);

function render(){
  const from = since(), items = data.items;
  const inPeriod = items.filter(i => +t(i.added_at) >= from);
  const doneInPeriod = items.filter(i => i.status === 'done' && +t(i.done_at) >= from);
  const pending = items.filter(i => i.status !== 'done');
  const claimed = pending.filter(i => i.status === 'claimed');
  const urgent = pending.filter(i => i.priority === 'high');
  const durations = doneInPeriod.map(i => t(i.done_at) - t(i.added_at)).filter(x => x >= 0);
  const oldest = pending.map(i => Date.now() - t(i.added_at)).sort((a, b) => b - a)[0];

  $('kpis').innerHTML = [
    ['المطلوبة في الفترة', inPeriod.length, ''],
    ['تمت في الفترة', doneInPeriod.length, 'green', (n => n ? `منها ${n} بتأكيد المشرف` : '')(doneInPeriod.filter(i => i.confirmed_by).length)],
    ['المتبقية الآن', pending.length, '', oldest ? 'أقدمها منذ ' + fmtDur(oldest) : ''],
    ['في الطريق الآن', claimed.length, 'amber'],
    ['عاجلة متبقية', urgent.length, urgent.length ? 'red' : ''],
    ['متوسط زمن الإنجاز', durations.length ? fmtDur(avg(durations)) : '—', '', 'من الطلب حتى المعالجة'],
  ].map(([l, v, c, h]) => `<div class="kpi ${c}"><div class="label">${l}</div><div class="value">${v}</div>${h ? `<div class="hint">${h}</div>` : ''}</div>`).join('');

  // by supervisor
  const sup = {};
  for (const i of inPeriod) {
    const k = i.added_by || 'غير محدد', s = sup[k] = sup[k] || { req: 0, done: 0, urgent: 0 };
    s.req++; if (i.status === 'done') s.done++; if (i.priority === 'high') s.urgent++;
  }
  const supRows = Object.entries(sup).sort((a, b) => b[1].req - a[1].req);
  $('bySup').innerHTML = supRows.length
    ? `<tr><th>المشرف</th><th>طلب</th><th>عاجلة</th><th>تمت</th><th>متبقية</th><th>نسبة الإنجاز</th></tr>` +
      supRows.map(([k, s]) => `<tr><td>${esc(k)}</td><td>${s.req}</td><td>${s.urgent || '—'}</td><td>${s.done}</td><td>${s.req - s.done}</td>
        <td><div class="meter"><span><i style="width:${s.done / s.req * 100}%"></i></span><b>${Math.round(s.done / s.req * 100)}%</b></div></td></tr>`).join('')
    : '<tr><td class="empty">لا توجد طلبات في هذه الفترة</td></tr>';

  // by technician
  const tech = {};
  for (const i of doneInPeriod) {
    const s = tech[i.done_by] = tech[i.done_by] || { done: 0, now: 0, dur: [] };
    s.done++; const d = t(i.done_at) - t(i.added_at); if (d >= 0) s.dur.push(d);
  }
  for (const i of claimed) (tech[i.claimed_by] = tech[i.claimed_by] || { done: 0, now: 0, dur: [] }).now++;
  const techRows = Object.entries(tech).sort((a, b) => b[1].done - a[1].done);
  const maxDone = Math.max(1, ...techRows.map(([, s]) => s.done));
  $('byTech').innerHTML = techRows.length
    ? `<tr><th>المشغل</th><th>أنجز</th><th>في الطريق الآن</th><th>متوسط الزمن</th></tr>` +
      techRows.map(([k, s]) => `<tr><td>${esc(k)}</td>
        <td><div class="meter"><span><i style="width:${s.done / maxDone * 100}%"></i></span><b>${s.done}</b></div></td>
        <td>${s.now || '—'}</td><td>${fmtDur(avg(s.dur))}</td></tr>`).join('')
    : '<tr><td class="empty">لا يوجد إنجاز في هذه الفترة</td></tr>';

  // stations table: requested or completed in period + everything still pending
  const q = $('q').value.replace(/\D/g, ''), fs = $('fStatus').value, fsup = $('fSup').value;
  let rows = items.filter(i => +t(i.added_at) >= from || i.status !== 'done' || +t(i.done_at) >= from);
  if (q) rows = rows.filter(i => String(i.station).includes(q));
  if (fs === 'pending') rows = rows.filter(i => i.status !== 'done');
  else if (fs === 'urgent') rows = rows.filter(i => i.priority === 'high');
  else if (fs) rows = rows.filter(i => i.status === fs);
  if (fsup) rows = rows.filter(i => (i.added_by || 'غير محدد') === fsup);
  const order = { claimed: 0, open: 1, done: 2 };
  rows.sort((a, b) => ((b.priority === 'high' && b.status !== 'done') - (a.priority === 'high' && a.status !== 'done'))
    || order[a.status] - order[b.status] || (t(b.added_at) - t(a.added_at)));
  $('stCount').textContent = rows.length + ' محطة';
  $('stations').innerHTML = rows.length
    ? `<tr><th>المحطة</th><th>طلبها</th><th>وقت الطلب</th><th>الحالة</th><th>المشغل</th><th>وقت المعالجة</th><th>المدة</th></tr>` +
      rows.slice(0, shown).map(i => {
        const tech = i.status === 'done' ? i.done_by : i.claimed_by;
        const dur = i.status === 'done' ? t(i.done_at) - t(i.added_at) : Date.now() - t(i.added_at);
        return `<tr><td class="num">S${i.station}</td><td>${esc(i.added_by || 'غير محدد')}</td><td>${fmtTime(t(i.added_at))}</td>
          <td><span class="pill ${i.status}">${STATUS[i.status] || i.status}</span>${i.priority === 'high' ? ' <span class="pill red">عاجلة</span>' : ''}</td>
          <td>${esc(tech) || '—'}${i.confirmed_by ? `<br><span class="pill conf">بتأكيد ${esc(i.confirmed_by)}</span>` : ''}</td><td>${i.status === 'done' ? fmtTime(t(i.done_at)) : '—'}</td>
          <td class="${i.status === 'done' ? '' : 'muted'}">${fmtDur(dur)}${i.status === 'done' ? '' : ' (جارية)'}</td></tr>`;
      }).join('')
    : '<tr><td class="empty">لا توجد محطات مطابقة</td></tr>';
  $('more').hidden = rows.length <= shown;
}

async function enter(){
  $('err').textContent = '';
  pin = $('pin').value.trim(); if (!pin) return;
  $('enter').disabled = true;
  try { await load(); ss.set('dash_pin', pin); $('lock').hidden = true; }
  catch (e) { $('err').textContent = e.message; pin = ''; }
  finally { $('enter').disabled = false; }
}
$('enter').onclick = enter;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
$('logout').onclick = () => { ss.set('dash_pin', ''); pin = ''; $('pin').value = ''; $('lock').hidden = false; };
$('refresh').onclick = () => load().catch(e => { $('liveTxt').textContent = 'تعذّر التحديث: ' + e.message; });
$('period').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  period = b.dataset.p; shown = 50;
  for (const x of $('period').children) x.classList.toggle('on', x === b);
  render();
});
['q', 'fStatus', 'fSup'].forEach(id => $(id).addEventListener('input', () => { shown = 50; render(); }));
$('more').onclick = () => { shown += 50; render(); };
// live: refresh every 30 s while the page is open, and right away when it comes back to the front
setInterval(() => { if (pin && !document.hidden) load().catch(() => {}); }, 30000);
document.addEventListener('visibilitychange', () => { if (pin && !document.hidden && Date.now() - lastLoad > 15000) load().catch(() => {}); });

if (pin) load().then(() => $('lock').hidden = true).catch(() => { pin = ''; ss.set('dash_pin', ''); });
</script>
</body>
</html>
